<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <h2>Travel Reservation Form</h2>
    <br>
    <h3>* denote mandotory</h3>

    <label for="name">Full name*:</label>
    <input type="text" name="name" id="name" placeholder="FirstNamae LastName">
    <br>
    <br>

    <label for="email">Email Address*:</label>
    <input type="text" name="name" id="name" placeholder="EMAIL_ADDRESS">
    <br>
    <br>

    <label for="package">Select Tour Package*:</label>
    <select name="package" id="package">
        <option value="goa">Goa</option>
        <option value="punjab">Punjab</option>
        <option value="kashmir">Kashmir</option>
        <option value="sikkim">Sikkim</option>
    </select>
    <br>
    <br>

    <label for="date">Arrival Dtae*:</label>
    <input type="date" name="datePicker" id="date" placeholder="m/d/y">
    <br>
    <br>

    <label for="person">Number of Persons*:</label>
    <input type="text" name="person" id="person" placeholder="UNKNOWN_TYPE">
    <br>
    <br>

    <label for="avail">What wouls you want to avail?*</label>
    <br>
    <label for="avail">Boarding</label>
    <input type="checkbox" name="avail" id="avail">
    <br>

    <label for="avail">Fooding</label>
    <input type="checkbox" name="avail" id="avail">
    <br>

    <label for="avail">Sight Seeing</label>
    <input type="checkbox" name="avail" id="avail">
    <br>
    <br>
    <label for="code">Discount Coupon Code:</label>
    <input type="text" name="code" id="code" placeholder="UNKNOWN_TYPE">
    <br>
    <br>

    <label for="terms">Terms and Condition*</label>
    <br>

    <label for="agree">I agree</label>
    <input type="radio" name="radio1 id="agree1">

    <label for="agree2">I disagree</label>
    <input type="radio" name="radio1 id="agree2">
    <br>

    <button>Complete Reservation</button>
</body>
</html>
