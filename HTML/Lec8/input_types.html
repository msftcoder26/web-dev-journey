<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <form>
        <!-- textfield -->
        <!-- by default input tag is text so even if we dont specify the type, i'll be text only -->
        <label for="textfield"></label>
        <input type="text" name="'textfield" id="textfield">
   
        <br>
        <br>
        <!-- button -->
        <label for="button">Button</label>
        <input type="submit" name="button" id="button" value="Subscribe">
   
        <br>
        <br>
        <!-- radio  -->

        <!-- name same ⇒ only one can be selected
            id different ⇒ labels properly connect hote hain -->
        <label for="radio1">Male</label>
        <input type="radio" name="radio1" id="radio1">
         <br>
         <br>

         <label for="radio2">Female</label>
        <input type="radio" name="radio1" id="radio2">
         <br>
         <br>

         <label for="radio3">Others</label>
        <input type="radio" name="radio1" id="radio3">
         <br>
         <br>

         <!-- checkbox -->
          <label for="checkbox1">English</label>
        <input type="checkbox" name="checkbox1" id="checkbox1">
         <br>
         <br>
         <label for="checkbox2">Hindi</label>
        <input type="checkbox" name="checkbox2" id="checkbox2">

        <br>
         <br>
        <!-- file -->
          <label for="fileselect">Upload</label>
          <input type="file" name="fileselect" id="fileselect">
    
          <br>
         <br>
         <!-- image -->
         <input type="image" name="imageButton" id="imageButton" alt="click here" src="Button.png"
         height="20px" width="20px">

         <br>
         <br>

         <!-- password -->
          <label for="password1">Password:</label>
          <input type="password" name="password1" id="password1" placeholder="Enter password">

         <br>
         <br>
          <!-- date -->
           <label for="datepicker">Enter Date:</label>
          <input type="date" name="datepicker" id="datepicker">

        </form>
</body>
</html>
