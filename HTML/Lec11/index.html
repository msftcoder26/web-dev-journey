<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <!-- img -->
    <!-- Lazy loading delays loading of images/videos until they are actually needed -->
    <!-- Benefits of Lazy Loading
    ✅ Faster page loading
    ✅ Better performance
    ✅ Less bandwidth usage
    ✅ Improves user experience -->


    <img src="logo.png" height="150px" width="160px" alt="Logo"  loading="lazy">

    <br>
    <!-- audio -->
    <!-- its imp to add controls to make the audio visible on the web page -->
    <audio src="audio.mp3" controls>Kahani Suno</audio>

    <br>
    <!-- video -->
    <!-- use controls attribute  -->
    <video src="video.mp4" height=150px, width=160px controls>MEEE</video>

    <br>

    <!-- iframe -->
    <iframe src="../lec10/Project1.html" frameborder="1"  height="200px" width="200px"></iframe>

    <br>
    <!-- <iframe src="https://www.youtube.com/watch?v=z1VdU6ZwRwY" frameborder="1"></iframe> -->
    
    <!-- remove watch?v= and add embed/ -->
    <iframe src="https://www.youtube.com/embed/z1VdU6ZwRwY" frameborder="1"></iframe>
    <!-- Kuch YouTube videos embedding allow nahi karti. isliye thumbnail/video nahi aa raha. -->

</body>
</html>
