<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        div{
            border: 1px solid black;
        }
        img{
            margin: 50px;
        }

        .container{
        /* images automatically ek row me aa jayengi. */
        display: flex;
        /* gap automatically sab images ke beech equal spacing dega. */
        
        }

        /* Relative positioning */
        .image2{
            position: relative;
            top: 100px;
            left: 200px;
        } 

        /* Absolute Positioning */
        .image3{
            position: absolute;
            top: 100px;
            bottom: 100px;
        } 

        /* Fixed positioning */
        /* scroll hone par bhi move nahi hoga */
        .image4{
            position: fixed;
            top: 20px;
            right: 20px;
        }

        /* Sticky Positioning */
        .image3{
            position: sticky;
            top: 100px;
        }

    </style>
</head>
<body>
    <!-- .container -->
    <div class="container">
        <img src="download.jpg" alt="A" width="200px" height="200px" class="image1">

        <img src="download (1).jpg" alt="B" width="200px" height="200px" class="image2">

        <img src="download (2).jpg" alt="C" width="200px" height="200px" class="image3">

        <img src="download (3).jpg" alt="D" width="300px" height="200px" class="image4">
    </div>
</body>
</html>
