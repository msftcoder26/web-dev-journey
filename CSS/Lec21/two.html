<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width= , initial-scale=1.0">
    <title>Document</title>

    <style>
        .container{
            border: 2px solid black;
            background-color: #3482db;
            display: flex;
            margin: 3px;
            padding: 2px;
        }

        .box{
            border: 1px solid black;
            height: 200px;
            width: 200px;
            background-color: beige;
            margin: 3px;
            padding: 2px;
        }

        #boxleft{
            background-color: rgb(89, 13, 161);
            border: 2px solid black;
            display: flex;
            flex-direction: column;
        }

        #boxright{
            background-color: rgb(74, 205, 161);
            border: 2px solid rgb(81, 36, 2);
        }

        p{
            border: 2px solid rgb(221, 22, 22);
        }

        @media (max-width: 640px ){
            .container{
                flex-direction: column;
            }
        }
        
    </style>
</head>
<body>
    <div class="container">

        <div class="box" id="boxleft">
            <p>Text1</p>
            <p>Text2</p>
        </div>

        <div class="box" id="boxright">
            <img src="bhagat.avif" alt="Bhagat Singh" height="100px" width="100px">
        </div>

    </div>
</body>
</html>
