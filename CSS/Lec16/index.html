            height:300px;
            margin: 25px;
            padding:50px;
        }

        span{
            border: 2px solid green;
            /* no custom width, height and margin */
            /* width=800px;
            height=800px; */
            /* margin=10px; */
            padding: 20px;
        }
    </style>
</head>
<body>
