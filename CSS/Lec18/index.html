<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
       .boxx{
        border: 2px solid red;
        width: 30%;
        background-color: rgb(236, 175, 175);
       } 

       .parent{
        border: 2px solid green;
        background-color: bisque;
       }

       .child{
        border: 2px solid grey;
        background-color: aquamarine;
        /* 40% of parent */
        width: 40%;
       }

       .container{
        font-size: 10px;
       }

       .box{
        font-size: 10em;
       }
    </style>
</head>
<body>
    
    <p>
        hello jee
    </p>

    <div class="boxx">
        Welcome to Codehelp
    </div>

    <div class="parent">
        <div class="child">
            CHILD
        </div>
    </div>

    <div class="container">
        <div class="box">
            hello hi wassup
        </div>
    </div>

</body>
</html>
