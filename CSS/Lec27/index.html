<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container{
            width: 100vw;
            height: 100vh;
            min-height: 800px;
            background: #3e778c;
            background: linear-gradient(90deg, rgba(62, 119, 140, 1) 0%, rgba(87, 199, 133, 1) 50%, rgba(237, 221, 83, 1) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box{
            width: 360px;
            height: 600px;
            background-color: white;
            border-radius: 20px;

            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            padding: 20px;
        }

        .box img{
            height: 57%;
            border-radius: 10px;

        }

        .box h2{
            font-weight: bold;
            font-size: 1.5rem;
        }

        .box p{
            font-size: 1.2em;
        }
    </style>

</head>
<body>
    
    <div class="container">

        <div class="box">
            <img src="qr.png">

            <h2>Improve your frontend skills by building projects</h2>

            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Asperiores illum eaque laudantium. Voluptas, temporibus aliquam. Fuga, iste similique?</p>
        </div>

    </div>

</body>
</html>
