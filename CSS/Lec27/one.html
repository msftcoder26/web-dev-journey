<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Card</title>

    <style>
                *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container{
            width: 100vw;
            height: 100vh;
            min-height: 800px;
            background: #7f7bc9;
            background: linear-gradient(90deg, rgba(127, 123, 201, 1) 0%, rgba(9, 9, 121, 1) 74%, rgba(0, 212, 255, 1) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card{
            width: 400px;
            height: 600px;
            background-color: white;
            border-radius: 20px;

            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        }

        .card img{
            height: 30%;
            width: 100%;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
        }

        .textbox{
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 70%;
            text-align: center;
        }

        #amountbox{
            width: 80%;
            height: 10%;
            background-color: #668cee;
            border-radius: 10px;

            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-right: 20px;
            padding-left: 20px;
        }

        #leftbox{
            /* width: fit-content; */
            height: 100%;
            display: flex;
            gap: 15px;

            
            align-items: center;
        }

        .imgbox img{
            height: 3rem;
            width: 3rem;
            border-radius: 10px;
        }
        #paymentButton{
            width: 80%;
            height: 9%;
            background-color: #7dd1f0;
            color: white;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.19), 0 6px 6px rgba(0,0,0,0.23);
        }

        .cancelBox a{
            text-decoration: none;
            color: rgb(50, 49, 49);
            font-weight: bold;
            font-size: large;
        }


    </style>
    
</head>
<body>
    
    <div class="container">

        <div class="card">

            <img src="tech.jpg">

            <div class="textbox">
                <h2>Order Summary</h2>
                <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Tenetur maxime, vel quos nam soluta officiis!</p>
            </div>

            <div id="amountbox">

                <div id="leftbox">

                    <div class="imgbox">
                        <img src="fevicon.png">
                    </div>

                    <div id="textAmount">
                        <p>Amount</p>
                        <p>$99.9/yr</p>
                    </div>
                </div>

                <div class="rightBox">
                    <a href="#">Change</a>
                </div>
            </div>

            <button id="paymentButton">Proceed to Payment</button>

            <div class="cancelBox">
                <a href="#">Cancle Order</a>
            </div>

        </div>
    </div>
</body>
</html>
